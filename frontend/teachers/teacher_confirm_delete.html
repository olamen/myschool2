{% extends "base.html" %}
{% block body %}
<div class="container mt-5">
    <h1 class="text-center">Delete Teacher</h1>
    <p class="text-center">Are you sure you want to delete {{ teacher.name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'teacher_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
