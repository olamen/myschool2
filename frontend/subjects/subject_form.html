{% extends "base.html" %}
{% block body %}
<div class="container mt-4">
    <h2>{% if subject %}Modifier{% else %}Créer{% endif %} un Sujet</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Nom du Sujet</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ subject.name|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label for="grade" class="form-label">Grade</label>
            <select id="grade" name="grade" class="form-select" required>
                <option value="">Sélectionnez un grade</option>
                {% for grade in grades %}
                <option value="{{ grade.id }}" {% if subject and subject.grade.id == grade.id %}selected{% endif %}>{{ grade.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div id="primary-fields" class="mb-3 d-none">
            <label for="points" class="form-label">Points (pour primaire)</label>
            <input type="number" id="points" name="points" class="form-control" min="0" value="{{ subject.points|default:'' }}">
        </div>
        <div id="secondary-fields" class="mb-3 d-none">
            <label for="coefficient" class="form-label">Coefficient (pour secondaire/lycée)</label>
            <input type="number" id="coefficient" name="coefficient" class="form-control" step="0.1" value="{{ subject.coefficient|default:'' }}">
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const gradeSelect = document.getElementById('grade');
        const primaryFields = document.getElementById('primary-fields');
        const secondaryFields = document.getElementById('secondary-fields');

        function toggleFields() {
            const selectedGrade = gradeSelect.options[gradeSelect.selectedIndex].text.trim().toLowerCase();
            console.log('Selected grade:', selectedGrade); // Debug: Log selected grade
            console.log('Primary fields element:', primaryFields); // Debug: Log primary fields element
            console.log('Secondary fields element:', secondaryFields); // Debug: Log secondary fields element

            if (selectedGrade === 'primaire') {
                console.log('Displaying primary fields, hiding secondary fields'); // Debug: Log action
                primaryFields.classList.remove('d-none');
                secondaryFields.classList.add('d-none');
            } else {
                console.log('Displaying secondary fields, hiding primary fields'); // Debug: Log action
                primaryFields.classList.add('d-none');
                secondaryFields.classList.remove('d-none');
            }
        }

        gradeSelect.addEventListener('change', function () {
            console.log('Grade dropdown changed'); // Debug: Log dropdown change
            toggleFields();
        });

        console.log('Initializing toggleFields on page load'); // Debug: Log initialization
        toggleFields(); // Initial toggle based on preselected grade
    });
</script>
{% endblock %}
