{% extends "base.html" %}
{% block body %}
<div class="container mt-4">
    <h2>{% if subject %}Modifier{% else %}Créer{% endif %} un Sujet</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Nom du Sujet</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ subject.name|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label for="grade" class="form-label">Grade</label>
            <select id="grade" name="grade" class="form-select" required>
                <option value="">Sélectionnez un grade</option>
                {% for grade in grades %}
                <option value="{{ grade.id }}" {% if subject and subject.grade.id == grade.id %}selected{% endif %}>
                    {{ grade.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div id="primary-fields" class="mb-3 d-none">
            <label for="points" class="form-label">Points (pour primaire)</label>
            <input type="number" id="points" name="points" class="form-control" min="0" value="{{ subject.points|default:'' }}">
        </div>
        <div id="secondary-fields" class="mb-3 d-none">
            <label for="coefficient" class="form-label">Coefficient (pour secondaire/lycée)</label>
            <input type="number" id="coefficient" name="coefficient" class="form-control" step="0.1" value="{{ subject.coefficient|default:'' }}">
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
    const gradeSelect = document.getElementById('grade');
    const primaryFields = document.getElementById('primary-fields');
    const secondaryFields = document.getElementById('secondary-fields');

    // Ensure all elements are found
    if (!gradeSelect || !primaryFields || !secondaryFields) {
        console.error('Missing required elements. Check the IDs:', {
            gradeSelect,
            primaryFields,
            secondaryFields,
        });
        return;
    }

    function toggleFields() {
        // Get the selected grade text
        const selectedGrade = gradeSelect.options[gradeSelect.selectedIndex]?.text.trim().toLowerCase();
        console.log('Selected grade:', selectedGrade);

        // Toggle visibility based on selected grade
        if (selectedGrade === 'primaire') {
            console.log('Showing primary fields, hiding secondary fields');
            primaryFields.classList.remove('d-none'); // Show primary fields
            secondaryFields.classList.add('d-none'); // Hide secondary fields
        } else if (selectedGrade === 'secondaire' || selectedGrade === 'lycée') {
            console.log('Showing secondary fields, hiding primary fields');
            primaryFields.classList.add('d-none'); // Hide primary fields
            secondaryFields.classList.remove('d-none'); // Show secondary fields
        } else {
            console.log('Hiding both fields (default case)');
            primaryFields.classList.add('d-none'); // Hide primary fields
            secondaryFields.classList.add('d-none'); // Hide secondary fields
        }

        // Debugging: Check applied classes
        console.log('Primary fields classes:', primaryFields.classList.toString());
        console.log('Secondary fields classes:', secondaryFields.classList.toString());
    }

    // Add event listener to the grade dropdown
    gradeSelect.addEventListener('change', toggleFields);

    // Trigger the toggle on page load in case a grade is preselected
    console.log('Initializing toggleFields on page load');
    toggleFields();
});
</script>
{% endblock %}
