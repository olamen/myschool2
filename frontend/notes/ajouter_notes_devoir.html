{% extends "base.html" %}
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter les Notes des Étudiants</title>

</head>
{% block body %}
    <div class="container my-5">
        <h2 class="mb-4">Ajouter les Notes des Étudiants</h2>

        <!-- Formulaire principal -->
        <form id="notesForm">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="sessionYear" class="form-label">Année Scolaire</label>
                    <select class="form-select" id="sessionYear" name="sessionYear">
                        <option value="">Sélectionnez une année</option>
                        {% for session in session_years %}
                        <option value="{{ session.id }}">{{ session.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="trimestre" class="form-label">Trimestre</label>
                    <select class="form-select" id="trimestre" name="trimestre">
                        <option value="">Sélectionnez un trimestre</option>
                        {% for trimestre in trimestres %}
                        <option value="{{ trimestre.id }}">{{ trimestre.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="devoir" class="form-label">Devoir</label>
                    <select class="form-select" id="devoir" name="devoir">
                        <option value="">Sélectionnez un devoir</option>
                        <!-- Les options des devoirs seront ajoutées dynamiquement ici -->
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="grade" class="form-label">Grade</label>
                    <select class="form-select" id="grade" name="grade">
                        <option value="">Sélectionnez un grade</option>
                        {% for grade in grades %}
                        <option value="{{ grade.id }}">{{ grade.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="classe" class="form-label">Classe</label>
                    <select class="form-select" id="classe" name="classe">
                        <option value="">Sélectionnez un grade</option>
                        {% for classe in classes %}
                        <option value="{{ classe.id }}">{{ classe.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="subject" class="form-label">Matière</label>
                    <select class="form-select" id="subject" name="subject">
                        <option value="">Sélectionnez une matière</option>
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
            </div>
        </form>

        <!-- Tableau des étudiants -->
        <table class="table table-bordered mt-4">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nom de l'Étudiant</th>
                    <th>Note</th>
                </tr>
            </thead>
            <tbody id="studentsTable">
                <!-- Les étudiants seront ajoutés dynamiquement ici -->
            </tbody>
        </table>

        <button type="button" class="btn btn-primary" id="saveNotes">Enregistrer les Notes</button>
    </div>

    <!-- Script JS -->
    <script>
        $(document).ready(function () {
            console.log("Script chargé");
    
            $('#grade').change(function () {
                const gradeId = $(this).val();
                const subjectSelect = $('#subject');
    
                console.log("Grade changé:", gradeId);
    
                // Reset subject options
                subjectSelect.empty();
                subjectSelect.append('<option value="">Sélectionnez une matière</option>');
    
                if (gradeId) {
                    $.ajax({
                        url: `/notes/get_subjects/${gradeId}/`,
                        type: 'GET',
                        success: function (data) {
                            console.log("Réponse AJAX (subjects):", data);
                            if (data.success && data.subjects.length > 0) {
                                data.subjects.forEach(function (subject) {
                                    subjectSelect.append(`<option value="${subject.id}">${subject.name}</option>`);
                                });
                            } else {
                                alert("Aucune matière trouvée pour cette classe.");
                            }
                        },
                        error: function (xhr) {
                            console.error("Erreur AJAX (subjects):", xhr.responseText);
                            alert("Erreur lors du chargement des matières.");
                        }
                    });
                }
            });
    
            $('#grade').change(function () {
                const gradeId = $(this).val();
                const classeSelect = $('#classe');
    
                console.log("Grade changé pour les classes:", gradeId);
    
                // Reset class options
                classeSelect.empty();
                classeSelect.append('<option value="">Sélectionnez une classe</option>');
    
                if (gradeId) {
                    $.ajax({
                        url: `/notes/get_classes/${gradeId}/`,
                        type: 'GET',
                        success: function (data) {
                            console.log("Réponse AJAX (classes):", data);
                            if (data.success && data.classes.length > 0) {
                                data.classes.forEach(function (classe) {
                                    classeSelect.append(`<option value="${classe.id}">${classe.name}</option>`);
                                });
                            } else {
                                alert("Aucune classe trouvée.");
                            }
                        },
                        error: function (xhr) {
                            console.error("Erreur AJAX (classes):", xhr.responseText);
                            alert("Erreur lors du chargement des classes.");
                        }
                    });
                }
            });
    
            $('#classe').change(function () {
                let classeId = $(this).val();
                let devoirId = $('#devoir').val();
    
                console.log("Classe changée:", classeId, "Devoir sélectionné:", devoirId);
    
                if (classeId && devoirId) {
                    $.ajax({
                        url: `/notes/get_students/${classeId}/${devoirId}/`,
                        type: "GET",
                        success: function (data) {
                            console.log("Réponse AJAX (students):", data);
                            let studentsTable = $('#studentsTable');
                            studentsTable.empty();
    
                            $.each(data.students, function (index, student) {
                                studentsTable.append(`
                                    <tr>
                                        <td>${index + 1}</td>
                                        <td>${student.name}</td>
                                        <td>
                                            <input type="number" class="form-control student-score" data-student-id="${student.id}" min="0" max="20" step="0.1">
                                        </td>
                                    </tr>
                                `);
                            });
                        },
                        error: function (xhr) {
                            console.error("Erreur AJAX (students):", xhr.responseText);
                        }
                    });
                }
            });
    
            $('#saveNotes').click(function () {
                let notes = [];
                $('.student-score').each(function () {
                    let studentId = $(this).data('student-id');
                    let score = $(this).val();
    
                    if (score) {
                        notes.push({
                            student_id: studentId,
                            score: score
                        });
                    }
                });
    
                console.log("Notes collectées:", notes);
    
                if (notes.length > 0) {
                    let csrfToken = $('input[name="csrfmiddlewaretoken"]').val();
                    let sessionYear = $('#sessionYear').val();
                    let subjectId = $('#subject').val();
                    let devoirId = $('#devoir').val();
                    let trimestreId = $('#trimestre').val();
    
                    if (!sessionYear) {
                        alert("Veuillez sélectionner une année scolaire.");
                        return;
                    }
    
                    $.ajax({
                        url: '/notes/notes_devoir/save/',
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({
                            notes: notes,
                            sessionyear: sessionYear,
                            subject_id: subjectId,
                            devoir_id: devoirId,
                            trimestre_id: trimestreId
                        }),
                        headers: {
                            'X-CSRFToken': csrfToken
                        },
                        success: function (response) {
                            console.log("Réponse AJAX (save notes):", response);
                            alert(response.message);
                        },
                        error: function (xhr) {
                            console.error("Erreur AJAX (save notes):", xhr.responseText);
                            alert(xhr.responseJSON?.message || "Erreur lors de l'enregistrement des notes.");
                        }
                    });
                } else {
                    alert("Veuillez entrer des notes pour les étudiants.");
                }
            });
    
            function resetNotes() {
                console.log("Réinitialisation des notes");
                $('.student-score').val('');
            }
    
            function loadNotes() {
                let classeId = $('#classe').val();
                let devoirId = $('#devoir').val();
                let subjectId = $('#subject').val();
                let sessionYear = $('#sessionYear').val();
                let trimestre = $('#trimestre').val();
    
                console.log("Chargement des notes pour:", { classeId, devoirId, subjectId, sessionYear, trimestre });
    
                if (!classeId || !subjectId || !sessionYear || !trimestre || (!devoirId && !$('#composition').val())) {
                    console.warn("Champs obligatoires manquants.");
                    return;
                }
    
                $.ajax({
                    url: '/notes/get_notes/',
                    type: 'GET',
                    data: {
                        classe_id: classeId,
                        devoir_id: devoirId,
                        subject_id: subjectId,
                        sessionyear_id: sessionYear,
                        trimestre_id: trimestre,
                        composition_id: $('#composition').val()
                    },
                    success: function (response) {
                        console.log("Réponse AJAX (load notes):", response);
                        if (response.success) {
                            let notes = response.notes;
                            $('.student-score').each(function () {
                                let studentId = $(this).data('student-id');
                                let note = notes.find(n => n.student_id == studentId);
                                if (note) {
                                    $(this).val(note.score);
                                }
                            });
                        } else {
                            console.warn(response.message);
                        }
                    },
                    error: function (xhr) {
                        console.error("Erreur AJAX (load notes):", xhr.responseText);
                    }
                });
            }
    
            $('#classe, #devoir, #subject, #sessionYear, #trimestre').change(function () {
                resetNotes();
                loadNotes();
            });
        });
    </script>
    
    <script>
        $(document).ready(function () {
            console.log("Script de gestion des devoirs chargé");
    
            $('#trimestre').change(function () {
                const trimestreId = $(this).val();
                const devoirSelect = $('#devoir');
    
                console.log("Trimestre changé:", trimestreId);
    
                devoirSelect.empty();
                devoirSelect.append('<option value="">Sélectionnez un devoir</option>');
    
                if (trimestreId) {
                    $.ajax({
                        url: `/notes/get_devoirs/${trimestreId}/`,
                        type: 'GET',
                        success: function (data) {
                            console.log("Réponse AJAX (devoirs):", data);
                            if (data.devoirs && data.devoirs.length > 0) {
                                data.devoirs.forEach(function (devoir) {
                                    devoirSelect.append(`<option value="${devoir.id}">${devoir.name}</option>`);
                                });
                            } else {
                                alert("Aucun devoir trouvé pour ce trimestre.");
                            }
                        },
                        error: function (xhr) {
                            console.error("Erreur AJAX (devoirs):", xhr.responseText);
                            alert("Erreur lors du chargement des devoirs.");
                        }
                    });
                }
            });
        });
    </script>
{% endblock %}
