{% extends "base.html" %}
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter les Notes des Étudiants</title>

</head>
{% block body %}
    <div class="container my-5">
        <h2 class="mb-4">Ajouter les Notes des Étudiants</h2>

        <!-- Formulaire principal -->
        <form id="notesForm">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="sessionYear" class="form-label">Année Scolaire</label>
                    <select class="form-select" id="sessionYear" name="sessionYear">
                        <option value="">Sélectionnez une année</option>
                        {% for session in session_years %}
                        <option value="{{ session.id }}">{{ session.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="trimestre" class="form-label">Trimestre</label>
                    <select class="form-select" id="trimestre" name="trimestre">
                        <option value="">Sélectionnez un trimestre</option>
                        {% for trimestre in trimestres %}
                        <option value="{{ trimestre.id }}">{{ trimestre.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="devoir" class="form-label">Devoir</label>
                    <select class="form-select" id="devoir" name="devoir">
                        <option value="">Sélectionnez un devoir</option>
                        <!-- Les options des devoirs seront ajoutées dynamiquement ici -->
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="grade" class="form-label">Grade</label>
                    <select class="form-select" id="grade" name="grade">
                        <option value="">Sélectionnez un grade</option>
                        {% for grade in grades %}
                        <option value="{{ grade.id }}">{{ grade.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="classe" class="form-label">Classe</label>
                    <select class="form-select" id="classe" name="classe">
                        <option value="">Sélectionnez un grade</option>
                        {% for classe in classes %}
                        <option value="{{ classe.id }}">{{ classe.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="subject" class="form-label">Matière</label>
                    <select class="form-select" id="subject" name="subject">
                        <option value="">Sélectionnez une matière</option>
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
            </div>
        </form>

        <!-- Tableau des étudiants -->
        <table class="table table-bordered mt-4">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nom de l'Étudiant</th>
                    <th>Note</th>
                </tr>
            </thead>
            <tbody id="studentsTable">
                <!-- Les étudiants seront ajoutés dynamiquement ici -->
            </tbody>
        </table>

        <button type="button" class="btn btn-primary" id="saveNotes">Enregistrer les Notes</button>
    </div>

    <!-- Script JS -->
    <script>
        $(document).ready(function () {
    function updateSelectOptions(selectElement, data, defaultText) {
        selectElement.empty().append(`<option value="">${defaultText}</option>`);
        if (data && data.length > 0) {
            data.forEach(item => selectElement.append(`<option value="${item.id}">${item.name}</option>`));
        }
    }

    // Charger les matières et les classes quand le grade change
    $('#grade').change(function () {
        const gradeId = $(this).val();
        updateSelectOptions($('#subject'), [], "Sélectionnez une matière");
        updateSelectOptions($('#classe'), [], "Sélectionnez une classe");

        if (gradeId) {
            $.get(`/notes/get_subjects/${gradeId}/`, function (data) {
                if (data.success) updateSelectOptions($('#subject'), data.subjects, "Sélectionnez une matière");
            });

            $.get(`/notes/get_classes/${gradeId}/`, function (data) {
                if (data.success) updateSelectOptions($('#classe'), data.classes, "Sélectionnez une classe");
            });
        }
    });

    // Charger les devoirs quand le trimestre change
    $('#trimestre').change(function () {
        const trimestreId = $(this).val();
        updateSelectOptions($('#devoir'), [], "Sélectionnez un devoir");

        if (trimestreId) {
            $.get(`/notes/get_devoirs/${trimestreId}/`, function (data) {
                if (data.devoirs) updateSelectOptions($('#devoir'), data.devoirs, "Sélectionnez un devoir");
            });
        }
    });

    // Charger les étudiants quand la classe est sélectionnée
    $('#classe, #devoir').change(function () {
        const classeId = $('#classe').val();
        const devoirId = $('#devoir').val();

        if (classeId && devoirId) {
            $.get(`/notes/get_students/${classeId}/${devoirId}/`, function (data) {
                const studentsTable = $('#studentsTable');
                studentsTable.empty();
                data.students.forEach((student, index) => {
                    studentsTable.append(`
                        <tr>
                            <td>${index + 1}</td>
                            <td>${student.name}</td>
                            <td><input type="number" class="form-control student-score" data-student-id="${student.id}" min="0" max="20" step="0.1"></td>
                        </tr>
                    `);
                });
            });
        }
    });

    // Sauvegarde des notes
    $('#saveNotes').click(function () {
        let notes = [];
        $('.student-score').each(function () {
            let studentId = $(this).data('student-id');
            let score = $(this).val();
            if (score) notes.push({ student_id: studentId, score: score });
        });

        if (notes.length > 0) {
            let csrfToken = $('input[name="csrfmiddlewaretoken"]').val();
            $.ajax({
                url: '/notes/notes_devoir/save/',
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    notes: notes,
                    sessionyear: $('#sessionYear').val(),
                    subject_id: $('#subject').val(),
                    devoir_id: $('#devoir').val(),
                    trimestre_id: $('#trimestre').val()
                }),
                headers: { 'X-CSRFToken': csrfToken },
                success: function (response) { alert(response.message); },
                error: function (xhr) { alert(xhr.responseJSON?.message || "Erreur lors de l'enregistrement."); }
            });
        } else {
            alert("Veuillez entrer des notes pour les étudiants.");
        }
    });

    // Charger les notes existantes
    function loadNotes() {
        let params = {
            classe_id: $('#classe').val(),
            devoir_id: $('#devoir').val(),
            subject_id: $('#subject').val(),
            sessionyear_id: $('#sessionYear').val(),
            trimestre_id: $('#trimestre').val(),
            composition_id: $('#composition').val()
        };

        if (params.classe_id && params.subject_id && params.sessionyear_id && params.trimestre_id) {
            $.get('/notes/get_notes/', params, function (response) {
                if (response.success) {
                    $('.student-score').each(function () {
                        let studentId = $(this).data('student-id');
                        let note = response.notes.find(n => n.student_id == studentId);
                        if (note) $(this).val(note.score);
                    });
                }
            });
        }
    }

    // Recharger les notes quand une donnée change
    $('#classe, #devoir, #subject, #sessionYear, #trimestre').change(function () {
        $('.student-score').val(''); // Réinitialisation des notes
        loadNotes();
    });
});
    </script>
{% endblock %}
