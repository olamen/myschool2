{% extends "base.html" %}
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter les Notes des Étudiants</title>

</head>
{% block body %}
    <div class="container my-5">
        <h2 class="mb-4">Ajouter les Notes des Étudiants</h2>

        <!-- Formulaire principal -->
        <form id="notesForm">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="sessionYear" class="form-label">Année Scolaire</label>
                    <select class="form-select" id="sessionYear" name="sessionYear">
                        <option value="">Sélectionnez une année</option>
                        {% for session in session_years %}
                        <option value="{{ session.id }}">{{ session.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="trimestre" class="form-label">Trimestre</label>
                    <select class="form-select" id="trimestre" name="trimestre">
                        <option value="">Sélectionnez un trimestre</option>
                        {% for trimestre in trimestres %}
                        <option value="{{ trimestre.id }}">{{ trimestre.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="exam" class="form-label">Exam</label>
                    <select class="form-select" id="exam" name="exam">
                        <option value="">Sélectionnez un Exam</option>
                        {% for exam in exams %}
                        <option value="{{ exam.id }}">{{ exam.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="subject" class="form-label">Matière</label>
                    <select class="form-select" id="subject" name="subject">
                        <option value="">Sélectionnez une matière</option>
                        {% for subject in subjects %}
                        <option value="{{ subject.id }}">{{ subject.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="classe" class="form-label">Classe</label>
                    <select class="form-select" id="classe" name="classe">
                        <option value="">Sélectionnez une classe</option>
                        {% for classe in classes %}
                        <option value="{{ classe.id }}">{{ classe.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </form>

        <!-- Tableau des étudiants -->
        <table class="table table-bordered mt-4">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nom de l'Étudiant</th>
                    <th>Note</th>
                </tr>
            </thead>
            <tbody id="studentsTable">
                <!-- Les étudiants seront ajoutés dynamiquement ici -->
            </tbody>
        </table>

        <button type="button" class="btn btn-primary" id="saveNotes">Enregistrer les Notes</button>
    </div>

    <!-- Script JS -->
    <script>
        $(document).ready(function () {
            // Load students when the class is selected
            $('#classe').change(function () {
                let classeId = $(this).val();
                let examId = $('#exam').val();
                if (classeId && examId) {
                    $.ajax({
                        url: `/notes/get_students/${classeId}/${examId}/`,
                        type: "GET",
                        success: function (data) {
                            let studentsTable = $('#studentsTable');
                            studentsTable.empty();
                            $.each(data.students, function (index, student) {
                                studentsTable.append(`
                                    <tr>
                                        <td>${index + 1}</td>
                                        <td>${student.name}</td>
                                        <td>
                                            <input type="number" class="form-control student-score" data-student-id="${student.id}" min="0" max="20" step="0.1">
                                        </td>
                                    </tr>
                                `);
                            });
                        }
                    });
                }
            });
    
            // Save notes
            $('#saveNotes').click(function () {
                let notes = [];
                $('.student-score').each(function () {
                    let studentId = $(this).data('student-id');
                    let score = $(this).val();
    
                    if (score) {
                        notes.push({
                            student_id: studentId,
                            score: score
                        });
                    }
                });
    
                if (notes.length > 0) {
                    let csrfToken = $('input[name="csrfmiddlewaretoken"]').val();
                    let sessionYear = $('#sessionYear').val();
                    let subjectId = $('#subject').val();
                    let examId = $('#exam').val();
                    let trimestreId = $('#trimestre').val();
    
                    if (!sessionYear) {
                        alert("Veuillez sélectionner une année scolaire.");
                        return;
                    }
    
                    $.ajax({
                        url: '/notes/notes_exam/save/',
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({
                            notes: notes,
                            sessionyear: sessionYear,
                            subject_id: subjectId,
                            exam_id: examId,
                            trimestre_id: trimestreId
                        }),
                        headers: {
                            'X-CSRFToken': csrfToken
                        },
                        success: function (response) {
                            alert(response.message);
                        },
                        error: function (xhr) {
                            alert(xhr.responseJSON.message || "Erreur lors de l'enregistrement des notes.");
                        }
                    });
                } else {
                    alert("Veuillez entrer des notes pour les étudiants.");
                }
            });
            function loadNotes() {
            let classeId = $('#classe').val();
            let examId = $('#exam').val();
            let subjectId = $('#subject').val();
            let sessionYear = $('#sessionYear').val();
            let trimestre = $('#trimestre').val();

            if (classeId && examId && subjectId && sessionYear && trimestre) {
                $.ajax({
                    url: '/notes/get_notes/',
                    type: 'GET',
                    data: {
                        classe_id: classeId,
                        exam_id: examId,
                        subject_id: subjectId,
                        sessionyear_id: sessionYear,
                        trimestre_id: trimestre,
                    },
                    success: function (response) {
                        if (response.success) {
                            let notes = response.notes;
                            $('.student-score').each(function () {
                                let studentId = $(this).data('student-id');
                                let note = notes.find(n => n.student_id == studentId);
                                if (note) {
                                    $(this).val(note.score);
                                }
                            });
                        } else {
                            console.error(response.message);
                        }
                    },
                    error: function (xhr) {
                        console.error("Erreur lors du chargement des notes:", xhr.responseText);
                    }
                });
            }
        }

        // Charger les étudiants et les notes quand la classe change
        $('#classe, #exam, #subject, #sessionYear, #trimestre').change(function () {
            loadNotes();
        });
        });

    </script>
{% endblock %}
