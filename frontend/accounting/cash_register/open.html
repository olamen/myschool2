<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouvrir la Caisse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Ouvrir la Caisse</h1>
    <form method="post">
        {% csrf_token %}
        <div class="card shadow-sm p-4">
            <div class="mb-3">
                <label for="initial_balance" class="form-label">Solde Initial (MRU)</label>
                <input type="number" step="0.01" name="initial_balance" id="initial_balance" class="form-control" placeholder="Entrez le solde initial" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg">Ouvrir la Caisse</button>
            </div>
        </div>
    </form>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
