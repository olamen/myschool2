{% extends "base.html" %}
{% block body %}
<div class="container mt-5">
    <h1 class="text-center">Ajouter un Paiement</h1>
    <hr />
    <form method="post" id="payment-form">
        {% csrf_token %} 
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100">Enregistrer</button>
    </form>
    <a href="{% url 'payment_list' %}" class="btn btn-secondary mt-3">Retour à la Liste</a>
</div>

<!-- Include Select2 Initialization -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $(document).ready(function () {
        // Initialize Select2 for parent field
        $('.parent-select').select2({
            placeholder: "Recherchez un parent (NNI ou nom)",
            ajax: {
                url: "{% url 'parent_search_autocomplete' %}", // Define this URL in views
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return {
                        q: params.term, // Search query
                    };
                },
                processResults: function (data) {
                    return {
                        results: data.map(function (item) {
                            return {
                                id: item.id,
                                text: `${item.name} (${item.nni})`
                            };
                        })
                    };
                },
            },
            minimumInputLength: 2,
        });
    });
</script>
{% endblock %}
