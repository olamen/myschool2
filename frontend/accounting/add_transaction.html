{% extends "basef.html" %} 
{% load static %}
{% block body %}
<div class="container mt-5">
    <h1 class="text-center">Ajouter une Transaction</h1>
    <hr />
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Enregistrer</button>
    </form>
    <a href="{% url 'transaction_list' %}" class="btn btn-secondary mt-3">Retour à la liste</a>
</div>
{% endblock %}
