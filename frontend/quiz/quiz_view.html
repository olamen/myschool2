{% extends 'basestudent.html' %}
{% load static %}
{% block time %}
<style>
    @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.bounce-animation {
    animation: bounce 0.5s infinite;
}
    
</style>

<div class="card-header ">
    <p id="timer" ><strong></strong></p>
</div>     
{% endblock time %}
{% block title %}
<title>{{ obj.name }}</title>
{% endblock title %}
{% block script %}
<script src=" {% static '/js/quiz_main.js' %}" defer></script>
{% endblock script %}


{% block body %}
<div class="container mt-4">
    

    <!-- Form Wizard -->
    <div id="quiz-wizard" class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5>Quiz Questions {{ obj.name }}</h5>
        </div>
        <div class="card-body">
            <form id="quiz-form">
                {% csrf_token %}
                <div class="progress mb-4">
                    <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <div id="question-container">
                    <!-- Questions will be dynamically loaded here -->
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <button type="button" id="prev-btn" class="btn btn-secondary" disabled>Previous</button>
                    <button type="button" id="next-btn" class="btn btn-primary">Next</button>
                </div>
            </form>
        </div>
    </div>

    
</div>
{% endblock %}
